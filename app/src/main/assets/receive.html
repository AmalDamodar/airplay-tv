<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send to {{NAME}}</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #111114; --dim: #6c6c72; --line: #e3e3e8;
    --accent: #111114; --on-accent: #ffffff; --bar: #e3e3e8; --ok: #30b05a; --bad: #d8453f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --dim: #98989f; --line: #2c2c2e;
            --accent: #f5f5f7; --on-accent: #111114; --bar: #2c2c2e; --ok: #34c759; --bad: #ff6961; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.15; margin: 28px 4px 4px; letter-spacing: -0.4px; }
  .sub { color: var(--dim); margin: 0 4px 24px; }
  .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .drop { text-align: center; padding: 36px 20px; border: 1.5px dashed var(--line); background: transparent; }
  .drop.over { border-color: var(--accent); }
  .drop p { margin: 0 0 16px; color: var(--dim); }
  button, .btn {
    appearance: none; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent);
    font: inherit; font-weight: 600; padding: 14px 28px; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  input[type=text], input[type=tel], input[type=password] {
    font: inherit; font-size: 28px; letter-spacing: 12px; text-align: center; width: 100%;
    padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; color: var(--text);
  }
  .row { padding: 14px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 0; }
  .row:last-child { padding-bottom: 0; }
  .name { font-weight: 600; word-break: break-all; }
  .meta { color: var(--dim); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; margin-top: 2px; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .15s linear; }
  .done .bar > i { background: var(--ok); }
  .fail .bar > i { background: var(--bad); }
  .fail .meta span:last-child { color: var(--bad); }
  .err { color: var(--bad); text-align: center; min-height: 1.4em; margin: 12px 0 0; }
  .hide { display: none; }
  .foot { color: var(--dim); font-size: 13px; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Send to {{NAME}}</h1>
  <p class="sub">Movies, videos, photos, APK files and more. They are saved in Downloads on the TV.</p>

  <section id="pinCard" class="card hide">
    <p style="margin:0 0 14px;text-align:center">Enter the PIN shown on the TV</p>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····">
    <p class="err" id="pinErr"></p>
    <p style="text-align:center;margin:12px 0 0"><button id="pinGo">Continue</button></p>
  </section>

  <section id="sendCard" class="card drop hide">
    <p id="dropText">Choose the files to send.</p>
    <button id="pick">Choose files</button>
    <input id="file" type="file" multiple class="hide">
  </section>

  <section id="listCard" class="card hide"></section>
  <p class="foot">Keep this page open until every file shows Done.</p>
</main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var pin = ((location.hash.match(/pin=(\d{4})/) || [])[1]) || '';
  try { if (!pin) pin = sessionStorage.getItem('pin') || ''; } catch (e) {}
  var queue = [], busy = false, wake = null;

  function size(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
  }
  function show(id, on) { $(id).classList.toggle('hide', !on); }

  function check(p, cb) {
    var x = new XMLHttpRequest();
    x.open('POST', '/check');
    x.setRequestHeader('X-Pin', p);
    x.onload = function () { cb(x.status); };
    x.onerror = function () { cb(0); };
    x.send();
  }
  function ready() {
    try { sessionStorage.setItem('pin', pin); } catch (e) {}
    if (location.hash) history.replaceState(null, '', location.pathname);
    show('#pinCard', false); show('#sendCard', true);
  }
  function askPin(msg) { show('#pinCard', true); show('#sendCard', false); $('#pinErr').textContent = msg || ''; $('#pin').focus(); }
  function tryPin(p, quiet) {
    check(p, function (s) {
      if (s === 200) { pin = p; ready(); }
      else if (s === 429) askPin('Too many wrong PINs. Wait a minute and try again.');
      else if (s === 403) askPin(quiet ? '' : 'Wrong PIN.');
      else askPin('Cannot reach the TV. Is the receiver screen still open?');
    });
  }
  $('#pinGo').onclick = function () { tryPin($('#pin').value.trim(), false); };
  $('#pin').onkeydown = function (e) { if (e.key === 'Enter') $('#pinGo').click(); };
  if (pin) tryPin(pin, true); else askPin('');

  $('#pick').onclick = function () { $('#file').click(); };
  $('#file').onchange = function () { add(this.files); this.value = ''; };
  var drop = $('#sendCard');
  ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { add(e.dataTransfer.files); });

  function add(files) {
    for (var i = 0; i < files.length; i++) {
      var f = files[i], row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="name"></div><div class="meta"><span></span><span>Waiting</span></div><div class="bar"><i></i></div>';
      row.firstChild.textContent = f.name;
      row.querySelector('.meta span').textContent = size(f.size);
      $('#listCard').insertBefore(row, $('#listCard').firstChild);
      queue.push({ file: f, row: row });
    }
    show('#listCard', true);
    next();
  }

  function next() {
    if (busy || !queue.length) { if (!busy && wake) { try { wake.release(); } catch (e) {} wake = null; } return; }
    busy = true;
    try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {}); } catch (e) {}
    var job = queue.shift(), f = job.file, row = job.row;
    var state = row.querySelector('.meta span:last-child'), bar = row.querySelector('.bar i');
    var x = new XMLHttpRequest(), t0 = Date.now();
    function end(ok, msg) {
      row.classList.add(ok ? 'done' : 'fail');
      state.textContent = msg;
      if (ok) bar.style.width = '100%';
      busy = false; next();
    }
    x.open('PUT', '/upload?name=' + encodeURIComponent(f.name));
    x.setRequestHeader('X-Pin', pin);
    x.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      bar.style.width = (100 * e.loaded / e.total).toFixed(1) + '%';
      var s = (Date.now() - t0) / 1000;
      state.textContent = Math.floor(100 * e.loaded / e.total) + '%' + (s > 1 ? '  ·  ' + size(e.loaded / s) + '/s' : '');
    };
    x.onload = function () {
      if (x.status === 200) end(true, 'Done');
      else if (x.status === 403) { end(false, 'Wrong PIN'); askPin('The PIN changed. Enter the one on the TV.'); }
      else if (x.status === 429) end(false, 'Too many tries');
      else if (x.status === 507) end(false, 'Not enough space on the TV');
      else end(false, 'Failed (' + x.status + ')');
    };
    x.onerror = function () { end(false, 'Connection lost'); };
    x.send(f);
  }
})();
</script>
</body>
</html>
