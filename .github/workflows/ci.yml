name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8'

      - name: Android lint
        run: |
          ./gradlew lintRelease --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8'

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8'

      - name: Upload debug APK and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-airplay-ci
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-release.html
